<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f7f7;--surface:#fff;--ink:#19323a;--muted:#71838a;--line:#e4eceb;--teal:#0f766e;--teal-2:#dff5f0;--blue:#39739d;--blue-2:#e5f0f8;--amber:#c17b1c;--amber-2:#fff2d9;--red:#b94b54;--shadow:0 16px 40px #18423b0d;--radius:18px}.dark{--bg:#122221;--surface:#1b302e;--ink:#e7f3f0;--muted:#a5b9b6;--line:#2d4743;--teal-2:#164d47;--blue-2:#203e52;--amber-2:#4b3a1c;--shadow:0 16px 40px #0005}.dark .field input,.dark .field select,.dark .field textarea{background:#203633;color:var(--ink);border-color:#3a5752}.dark .quick button,.dark .metric{background:#203633}.dark .table td{border-color:#2d4743}.dark .btn-soft{background:#164d47;color:#a6e1d5}.dark .modal{background:var(--surface)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}.sidebar{width:248px;background:#103f3c;color:#d9efeb;padding:24px 15px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px}.brand-mark{width:42px;height:42px;border-radius:14px;background:#e6f8f1;color:var(--teal);display:grid;place-items:center;font-size:23px;font-weight:800}.brand strong{font-size:19px;color:#fff}.brand small{display:block;color:#91c5bd;font-size:11px;margin-top:2px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{background:transparent;color:#acd1cb;text-align:right;padding:13px 14px;border-radius:13px;display:flex;align-items:center;gap:11px;transition:.2s}.nav button:hover,.nav button.active{background:#206b64;color:#fff}.nav-icon{width:23px;text-align:center;font-size:19px}.side-note{margin-top:auto;background:#17534d;border:1px solid #31766f;border-radius:16px;padding:15px;color:#b9dfd9;font-size:12px;line-height:1.8}.main{flex:1;min-width:0;padding:28px 34px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{color:var(--teal);font-size:13px;font-weight:700}.topbar h1{font-size:28px;margin:5px 0 0;letter-spacing:-.5px}.today{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13px}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow)}.stat-label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}.stat-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}.stat-value{font-size:25px;font-weight:800;margin:13px 0 3px}.stat-foot{font-size:11px;color:var(--muted)}.teal{background:var(--teal-2);color:var(--teal)}.blue{background:var(--blue-2);color:var(--blue)}.amber{background:var(--amber-2);color:var(--amber)}.rose{background:#fbe8e8;color:var(--red)}.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:21px;box-shadow:var(--shadow);margin-bottom:18px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.card h2{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted);margin:4px 0 0}.btn{border-radius:11px;padding:10px 15px;font-weight:700;font-size:13px}.btn-primary{background:var(--teal);color:#fff}.btn-soft{background:#edf6f4;color:var(--teal)}.btn-danger{background:#fff0f0;color:var(--red)}.btn:active{transform:translateY(1px)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f7fbfa;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:15px;text-align:right}.quick button b{display:block;margin-bottom:5px}.quick button span{font-size:12px;color:var(--muted)}.inline-select{display:flex;gap:6px;align-items:stretch}.inline-select select{flex:1}.mini-btn{min-width:40px;border-radius:10px;background:var(--teal-2);color:var(--teal);font-weight:800}.duration-options{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.duration-options button{padding:8px 11px;border:1px solid var(--line);background:var(--surface);color:var(--teal);border-radius:9px;font-size:12px}.duration-options button:hover{background:var(--teal-2)}.segmented{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.segmented button{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 14px;border-radius:10px}.segmented button.active{background:var(--teal);border-color:var(--teal);color:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calendar-head{font-size:11px;color:var(--muted);text-align:center;padding:5px}.calendar-day{min-height:112px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;overflow:hidden}.calendar-day.today{border:2px solid var(--teal);padding:7px}.calendar-day.empty-day{background:transparent;border-style:dashed;opacity:.5}.day-number{font-weight:800;font-size:14px}.day-shift{margin-top:6px;padding:5px 6px;border-radius:7px;background:var(--teal-2);color:var(--ink);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-shift.proxy-day{background:var(--amber-2)}.calendar-summary{font-size:10px;color:var(--muted);margin-top:5px}.report-table td,.report-table th{white-space:normal}.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.suggestion{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}.suggestion b{display:block;margin-bottom:5px}.suggestion span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-weight:500;text-align:right;padding:0 10px 12px}.table td{padding:13px 10px;border-top:1px solid #edf2f1}.badge{font-size:11px;border-radius:20px;padding:5px 9px;display:inline-block}.badge.me{background:var(--blue-2);color:var(--blue)}.badge.proxy{background:var(--amber-2);color:#9b6513}.money{font-weight:700;color:var(--teal)}.empty{text-align:center;padding:35px 15px;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e5e2;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field textarea{resize:vertical;min-height:75px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f766e16}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.radio-row{display:flex;gap:8px}.radio{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px;text-align:center;font-size:13px;cursor:pointer}.radio.selected{border-color:var(--teal);background:var(--teal-2);color:var(--teal);font-weight:700}.radio input{display:none}.notice{background:#f8fbfb;border:1px dashed #bfd8d4;border-radius:12px;color:var(--muted);padding:11px;font-size:12px;margin-top:5px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f7faf9;border-radius:13px;padding:14px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:19px;margin-top:7px;display:block}.bar-list{display:flex;flex-direction:column;gap:16px}.bar-line{display:flex;align-items:center;gap:10px;font-size:12px}.bar-name{width:100px}.bar-track{height:8px;flex:1;background:#edf2f1;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:var(--teal);border-radius:20px}.bar-val{width:75px;text-align:left;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#123b3a66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:20px;padding:23px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:#f0f5f4;color:var(--muted);width:32px;height:32px;border-radius:10px}.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;left:22px;background:#163f3c;color:#fff;padding:12px 17px;border-radius:12px;display:none;z-index:20;font-size:13px}.toast.show{display:block}@media(max-width:980px){.sidebar{width:210px}.main{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:5;bottom:0;top:auto;width:100%;height:auto;padding:7px 8px;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px #16423a22}.brand,.side-note{display:none}.nav{flex-direction:row;justify-content:space-around;gap:2px}.nav button{padding:8px 5px;flex-direction:column;gap:2px;font-size:10px;text-align:center;flex:1}.nav-icon{font-size:17px}.main{padding:18px 14px 92px}.topbar{align-items:flex-start;margin-bottom:18px}.topbar h1{font-size:22px}.today{font-size:11px;padding:8px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:21px}.stat-label{font-size:11px}.quick{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.metric-row{grid-template-columns:1fr 1fr}.card{padding:16px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters .field{min-width:0}.filters .btn{grid-column:1/-1}.field{min-width:0}.bar-name{width:75px}}
</style>

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">✚</div><div><strong>شیفت‌یار</strong><small>مدیریت کارکرد داروخانه</small></div></div>
  <nav class="nav">
    <button class="active" data-view="dashboard"><span class="nav-icon">⌂</span>داشبورد</button>
    <button data-view="shift"><span class="nav-icon">＋</span>ثبت شیفت</button>
    <button data-view="pharmacies"><span class="nav-icon">▦</span>داروخانه‌ها</button>
    <button data-view="proxies"><span class="nav-icon">♙</span>قائم‌مقام‌ها</button>
    <button data-view="financial"><span class="nav-icon">◈</span>گزارش مالی</button>
    <button data-view="work"><span class="nav-icon">◫</span>گزارش کارکرد</button>
    <button data-view="shifts"><span class="nav-icon">☷</span>شیفت‌ها</button>
    <button data-view="monthly"><span class="nav-icon">▤</span>ماه‌نامه شیفت‌ها</button>
  </nav>
  <div class="side-note">اطلاعات شما فقط در همین دستگاه ذخیره می‌شود.<br>مناسب برای استفادهٔ روزانه در موبایل و دسکتاپ.</div>
</aside>
<main class="main">
  <div class="topbar"><div><div class="eyebrow">فضای کاری شما</div><h1 id="page-title">سلام، آمادهٔ ثبت کارکرد هستید؟</h1></div><div style="display:flex;align-items:center;gap:8px"><button class="btn btn-soft" id="auth-button" onclick="currentUser?logout():openAuth()">ورود / ثبت‌نام</button><button class="btn btn-soft" id="theme-toggle" onclick="toggleTheme()">☾ Night mode</button><div class="today" id="today"></div></div></div>
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-shift"></section>
  <section class="view" id="view-pharmacies"></section>
  <section class="view" id="view-proxies"></section>
  <section class="view" id="view-financial"></section>
  <section class="view" id="view-work"></section>
  <section class="view" id="view-shifts"></section>
  <section class="view" id="view-monthly"></section>
</main></div>
<div class="modal-backdrop" id="modal"><div class="modal" id="modal-content"></div></div><div class="toast" id="toast"></div>
<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.SUPABASE_CONFIG=window.SUPABASE_CONFIG||{url:'',anonKey:''};
const storeKey='shiftyar-data-v1';
const state=JSON.parse(localStorage.getItem(storeKey)||'null')||{pharmacies:[],proxies:[],shifts:[]};
let cloudClient=null,currentUser=null;
if(window.SUPABASE_CONFIG.url&&window.SUPABASE_CONFIG.anonKey&&window.supabase) cloudClient=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);
const faNum=n=>new Intl.NumberFormat('fa-IR').format(n||0);
const toman=n=>faNum(Math.round(n))+' تومان';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const save=()=>{localStorage.setItem(storeKey,JSON.stringify(state));cloudSave()};
const toast=msg=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pharmacy=id=>state.pharmacies.find(x=>x.id===id);
const proxy=id=>state.proxies.find(x=>x.id===id);
const duration=(start,end)=>{let [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);let d=(eh*60+em)-(sh*60+sm);if(d<=0)d+=1440;return d/60};
const total=sh=>sh.rate*sh.hours;
const faDate=()=>new Intl.DateTimeFormat('fa-IR',{dateStyle:'full'}).format(new Date());
const digitize=s=>String(s??'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
const normDate=s=>digitize(s).replace(/[^0-9]/g,'').replace(/^([0-9]{4})([0-9]{2})([0-9]{2})$/,'$1/$2/$3');
const dateNow=()=>{const parts=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return `${parts.find(x=>x.type==='year').value}/${parts.find(x=>x.type==='month').value}/${parts.find(x=>x.type==='day').value}`};
const persianMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const yearList=()=>{const y=Number(digitize(dateNow().split('/')[0]));return Array.from({length:5},(_,i)=>y-2+i)};
const monthMatch=(s,m)=>!m||digitize(s).startsWith(digitize(m));
function nav(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));const titles={dashboard:'سلام، آمادهٔ ثبت کارکرد هستید؟',shift:'ثبت یک شیفت جدید',pharmacies:'داروخانه‌های محل کار',proxies:'مدیریت قائم‌مقام‌ها',financial:'گزارش مالی دستمزد',work:'گزارش کارکرد شیفت‌ها',shifts:'همهٔ شیفت‌های ثبت‌شده',monthly:'شیفت‌ها در یک نگاه'};document.getElementById('page-title').textContent=titles[view];render(view)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
document.getElementById('today').textContent=faDate();
function shiftRows(list,actions=true){if(!list.length)return `<div class="empty"><strong>هنوز شیفت ثبت نشده است</strong>از دکمهٔ «ثبت شیفت» برای شروع استفاده کنید.</div>`;return `<div class="table-wrap"><table class="table"><thead><tr><th>تاریخ</th><th>داروخانه</th><th>حاضر</th><th>ساعت</th><th>دستمزد</th>${actions?'<th></th>':''}</tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(pharmacy(s.pharmacyId)?.name||'حذف‌شده')}</td><td><span class="badge ${s.worker==='me'?'me':'proxy'}">${s.worker==='me'?'من':esc(proxy(s.proxyId)?.name||'قائم‌مقام')}</span></td><td>${esc(s.start)} تا ${esc(s.end)} <small>(${faNum(s.hours)} ساعت)</small></td><td class="money">${toman(total(s))}</td>${actions?`<td><button class="btn btn-soft" onclick="editShift('${s.id}')">ویرایش</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function renderDashboard(){const mine=state.shifts.filter(s=>s.worker==='me'), proxies=state.shifts.filter(s=>s.worker==='proxy');document.getElementById('view-dashboard').innerHTML=`<div class="stats"><div class="stat"><div class="stat-label">پرداخت قائم‌مقام‌ها <span class="stat-icon amber">◈</span></div><div class="stat-value">${toman(proxies.reduce((a,s)=>a+total(s),0))}</div><div class="stat-foot">مجموع دستمزد ثبت‌شده</div></div><div class="stat"><div class="stat-label">داروخانه‌ها <span class="stat-icon rose">⌂</span></div><div class="stat-value">${faNum(state.pharmacies.length)}</div><div class="stat-foot">مکان فعال کارکرد</div></div></div><div class="grid-2"><div class="card"><div class="card-head"><div><h2>شیفت‌های اخیر</h2><p class="sub">آخرین ثبت‌های شما</p></div><button class="btn btn-soft" onclick="nav('shift')">ثبت شیفت</button></div>${shiftRows(state.shifts.slice(0,5),false)}</div><div class="card"><div class="card-head"><div><h2>دسترسی سریع</h2><p class="sub">مدیریت روزانه با چند کلیک</p></div></div><div class="quick"><button onclick="nav('shift')"><b>＋ ثبت شیفت جدید</b><span>محاسبهٔ خودکار مبلغ</span></button><button onclick="openPharmacy()"><b>⌂ افزودن داروخانه</b><span>تعریف نرخ ثابت ساعتی</span></button><button onclick="nav('financial')"><b>◈ مشاهده گزارش مالی</b><span>تفکیک من و قائم‌مقام‌ها</span></button><button onclick="nav('monthly')"><b>▤ ماه‌نامه شیفت‌ها</b><span>نمایش یک‌جای ماه</span></button><button onclick="backupData()"><b>⇩ پشتیبان‌گیری</b><span>ذخیرهٔ اطلاعات روی دستگاه</span></button><button onclick="restoreData()"><b>⇧ بازیابی اطلاعات</b><span>بارگذاری فایل پشتیبان</span></button></div></div></div><div class="card"><div class="card-head"><div><h2>پیشنهادهای امروز</h2><p class="sub">دسترسی سریع به کارهای بعدی</p></div></div><div class="suggestions"><button class="suggestion" onclick="nav('shifts')"><b>شیفت‌ها در یک نگاه</b><span>تمام ثبت‌ها و ویرایش آن‌ها</span></button><button class="suggestion" onclick="nav('work')"><b>بررسی کارکرد</b><span>تفکیک من و قائم‌مقام‌ها</span></button><button class="suggestion" onclick="nav('financial')"><b>گزارش مالی</b><span>مبلغ و جزئیات پرداخت</span></button></div></div>`}
function renderShift(editId){const s=state.shifts.find(x=>x.id===editId);const p=s?pharmacy(s.pharmacyId):null;document.getElementById('view-shift').innerHTML=`<div class="card"><div class="card-head"><div><h2>${s?'ویرایش شیفت':'ثبت شیفت جدید'}</h2><p class="sub">ساعت پایان می‌تواند مربوط به روز بعد باشد.</p></div>${s?'<button class="btn btn-danger" onclick="deleteShift(\''+s.id+'\')">حذف شیفت</button>':''}</div>${!state.pharmacies.length?'<div class="notice">ابتدا حداقل یک داروخانه در بخش داروخانه‌ها ثبت کنید.</div>':''}<form id="shift-form" class="form-grid"><div class="field"><label>تاریخ شروع شیفت</label><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><select name="year" required>${Array.from({length:5},(_,i)=>yearList()[i]).map(y=>`<option ${String(y)===digitize((s?.date||dateNow()).split('/')[0])?'selected':''}>${y}</option>`).join('')}</select><select name="month" required>${Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(m=>`<option ${m===digitize((s?.date||dateNow()).split('/')[1])?'selected':''} value="${m}">${persianMonths[Number(m)-1]}</option>`).join('')}</select><select name="day" required>${Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0')).map(d=>`<option ${d===digitize((s?.date||dateNow()).split('/')[2])?'selected':''}>${d}</option>`).join('')}</select></div></div><div class="field"><label>داروخانه</label><div class="inline-select"><select name="pharmacyId" required onchange="applyRate(this.value)"><option value="">انتخاب داروخانه</option>${state.pharmacies.map(x=>`<option value="${x.id}" ${s?.pharmacyId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button type="button" class="mini-btn" title="افزودن داروخانه" onclick="openQuickPharmacy()">＋</button></div></div><div class="field"><label>نرخ دستمزد هر ساعت (تومان)</label><input id="rate" name="rate" type="number" min="0" step="any" required value="${s?.rate??p?.rate??''}" placeholder="مثلاً ۲۵۰۰۰۰"></div><div class="field"><label>حاضر در این شیفت</label><div class="radio-row"><label class="radio ${(!s||s.worker==='me')?'selected':''}"><input type="radio" name="worker" value="me" ${(!s||s.worker==='me')?'checked':''} onchange="toggleProxy()">خودم</label><label class="radio ${s?.worker==='proxy'?'selected':''}"><input type="radio" name="worker" value="proxy" ${s?.worker==='proxy'?'checked':''} onchange="toggleProxy()">قائم‌مقام</label></div></div><div class="field" id="proxy-field" style="display:${s?.worker==='proxy'?'flex':'none'}"><label>نام قائم‌مقام</label><div class="inline-select"><select name="proxyId"><option value="">انتخاب قائم‌مقام</option>${state.proxies.map(x=>`<option value="${x.id}" ${s?.proxyId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button type="button" class="mini-btn" title="افزودن قائم‌مقام" onclick="openQuickProxy()">＋</button></div></div><div class="field"><label>ساعت شروع</label><input name="start" type="time" required value="${s?.start||'08:00'}"></div><div class="field"><label>ساعت پایان</label><input name="end" type="time" required value="${s?.end||'16:00'}"><div class="duration-options"><button type="button" onclick="setEndAfter(4)">+۴ ساعت</button><button type="button" onclick="setEndAfter(6)">+۶ ساعت</button><button type="button" onclick="setEndAfter(8)">+۸ ساعت</button><button type="button" onclick="setEndAfter(10)">+۱۰ ساعت</button><button type="button" onclick="setEndAfter(12)">+۱۲ ساعت</button></div></div><div class="field full"><label>یادداشت اختیاری</label><textarea name="note" placeholder="توضیحی برای این شیفت...">${esc(s?.note||'')}</textarea></div><div class="full"><div class="notice" id="duration-note">مدت شیفت پس از وارد کردن ساعت‌ها نمایش داده می‌شود.</div></div><div class="full"><button class="btn btn-primary" type="submit">${s?'ذخیرهٔ تغییرات':'ثبت شیفت و محاسبه مبلغ'}</button></div></form></div>`;document.getElementById('shift-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),worker=f.get('worker'),hours=duration(f.get('start'),f.get('end'));if(worker==='proxy'&&!f.get('proxyId'))return toast('لطفاً قائم‌مقام را انتخاب کنید');const item={id:s?.id||uid(),date:`${f.get('year')}/${f.get('month')}/${f.get('day')}`,pharmacyId:f.get('pharmacyId'),rate:Number(f.get('rate')),worker,proxyId:f.get('proxyId'),start:f.get('start'),end:f.get('end'),hours,note:f.get('note')};if(s)state.shifts=state.shifts.map(x=>x.id===s.id?item:x);else state.shifts.unshift(item);save();toast(s?'شیفت ویرایش شد':'شیفت ثبت شد');nav('dashboard')};updateDuration()}
function setEndAfter(hours){const form=document.getElementById('shift-form');if(!form?.start.value)return toast('ابتدا ساعت شروع را انتخاب کنید');const [h,m]=form.start.value.split(':').map(Number);const totalMinutes=(h*60+m+hours*60)%1440;form.end.value=`${String(Math.floor(totalMinutes/60)).padStart(2,'0')}:${String(totalMinutes%60).padStart(2,'0')}`;updateDuration()}
function openQuickPharmacy(){openModal(`<div class="modal-head"><h2>افزودن داروخانه</h2><button class="close" onclick="closeModal()">×</button></div><form id="quick-pharmacy"><div class="field"><label>نام داروخانه</label><input name="name" required></div><div class="field" style="margin-top:12px"><label>نرخ ثابت هر ساعت، اختیاری</label><input name="rate" type="number" min="0" step="any"></div><div class="modal-actions"><button class="btn btn-primary">افزودن و انتخاب</button></div></form>`);document.getElementById('quick-pharmacy').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item={id:uid(),name:f.get('name'),rate:f.get('rate')===''?null:Number(f.get('rate'))};state.pharmacies.push(item);save();closeModal();renderShift();document.querySelector('select[name=pharmacyId]').value=item.id;applyRate(item.id);toast('داروخانه اضافه و انتخاب شد')}}
function openQuickProxy(){openModal(`<div class="modal-head"><h2>افزودن قائم‌مقام</h2><button class="close" onclick="closeModal()">×</button></div><form id="quick-proxy"><div class="field"><label>نام و نام خانوادگی</label><input name="name" required></div><div class="field" style="margin-top:12px"><label>اطلاعات پرداخت، اختیاری</label><textarea name="payment"></textarea></div><div class="modal-actions"><button class="btn btn-primary">افزودن و انتخاب</button></div></form>`);document.getElementById('quick-proxy').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item={id:uid(),name:f.get('name'),payment:f.get('payment')};state.proxies.push(item);save();closeModal();renderShift();document.querySelector('input[name=worker][value=proxy]').checked=true;toggleProxy();document.querySelector('select[name=proxyId]').value=item.id;toast('قائم‌مقام اضافه و انتخاب شد')}}
function updateDuration(){const form=document.getElementById('shift-form');if(!form)return;const note=document.getElementById('duration-note');const a=form.start.value,b=form.end.value;if(a&&b){const h=duration(a,b);note.textContent=`مدت این شیفت: ${faNum(h)} ساعت — مبلغ تقریبی: ${toman(h*Number(form.rate.value||0))}`;form.start.onchange=updateDuration;form.end.onchange=updateDuration;form.rate.oninput=updateDuration}}
function applyRate(id){const p=pharmacy(id);if(p?.rate!=null)document.getElementById('rate').value=p.rate;updateDuration()}
function toggleProxy(){const checked=document.querySelector('input[name=worker]:checked')?.value;document.getElementById('proxy-field').style.display=checked==='proxy'?'flex':'none';document.querySelectorAll('.radio').forEach(x=>x.classList.toggle('selected',x.querySelector('input').checked))}
function editShift(id){nav('shift');setTimeout(()=>renderShift(id),0)}
function deleteShift(id){if(confirm('این شیفت حذف شود؟')){state.shifts=state.shifts.filter(x=>x.id!==id);save();toast('شیفت حذف شد');nav('dashboard')}}
function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function openPharmacy(id){const p=pharmacy(id);openModal(`<div class="modal-head"><h2>${p?'ویرایش داروخانه':'افزودن داروخانه'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="ph-form"><div class="field"><label>نام داروخانه</label><input name="name" required value="${esc(p?.name||'')}" placeholder="مثلاً داروخانه مرکزی"></div><div class="field" style="margin-top:14px"><label>نرخ ثابت هر ساعت (تومان) <small>اختیاری</small></label><input name="rate" type="number" min="0" step="any" value="${p?.rate??''}" placeholder="در صورت ثابت نبودن خالی بگذارید"></div><div class="modal-actions"><button class="btn btn-primary">ذخیره</button><button type="button" class="btn btn-soft" onclick="closeModal()">انصراف</button></div></form>`);document.getElementById('ph-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item={id:p?.id||uid(),name:f.get('name'),rate:f.get('rate')===''?null:Number(f.get('rate'))};if(p)state.pharmacies=state.pharmacies.map(x=>x.id===p.id?item:x);else state.pharmacies.push(item);save();closeModal();toast('اطلاعات داروخانه ذخیره شد');render('pharmacies')}}
function deletePharmacy(id){if(state.shifts.some(s=>s.pharmacyId===id))return toast('داروخانه دارای شیفت ثبت‌شده است');if(confirm('داروخانه حذف شود؟')){state.pharmacies=state.pharmacies.filter(x=>x.id!==id);save();render('pharmacies')}}
function renderPharmacies(){document.getElementById('view-pharmacies').innerHTML=`<div class="card"><div class="card-head"><div><h2>داروخانه‌های محل کار</h2><p class="sub">نرخ ثابت اختیاری است و در ثبت شیفت قابل تغییر خواهد بود.</p></div><button class="btn btn-primary" onclick="openPharmacy()">＋ افزودن داروخانه</button></div>${state.pharmacies.length?`<div class="table-wrap"><table class="table"><thead><tr><th>نام داروخانه</th><th>نرخ ثابت ساعتی</th><th></th></tr></thead><tbody>${state.pharmacies.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.rate==null?'<span class="sub">تعریف نشده</span>':toman(p.rate)}</td><td><button class="btn btn-soft" onclick="openPharmacy('${p.id}')">ویرایش</button> <button class="btn btn-danger" onclick="deletePharmacy('${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>داروخانه‌ای ثبت نشده است</strong>برای شروع، محل‌های کار خود را اضافه کنید.</div>'}</div>`}
function openProxy(id){const p=proxy(id);openModal(`<div class="modal-head"><h2>${p?'ویرایش قائم‌مقام':'افزودن قائم‌مقام'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="pr-form"><div class="field"><label>نام و نام خانوادگی</label><input name="name" required value="${esc(p?.name||'')}" placeholder="مثلاً سارا محمدی"></div><div class="field" style="margin-top:14px"><label>اطلاعات پرداخت</label><textarea name="payment" placeholder="شماره کارت یا توضیح پرداخت (اختیاری)">${esc(p?.payment||'')}</textarea></div><div class="modal-actions"><button class="btn btn-primary">ذخیره</button><button type="button" class="btn btn-soft" onclick="closeModal()">انصراف</button></div></form>`);document.getElementById('pr-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),item={id:p?.id||uid(),name:f.get('name'),payment:f.get('payment')};if(p)state.proxies=state.proxies.map(x=>x.id===p.id?item:x);else state.proxies.push(item);save();closeModal();toast('اطلاعات قائم‌مقام ذخیره شد');render('proxies')}}
function deleteProxy(id){if(state.shifts.some(s=>s.proxyId===id))return toast('برای این قائم‌مقام شیفت ثبت شده است');if(confirm('قائم‌مقام حذف شود؟')){state.proxies=state.proxies.filter(x=>x.id!==id);save();render('proxies')}}
function renderProxies(){document.getElementById('view-proxies').innerHTML=`<div class="card"><div class="card-head"><div><h2>قائم‌مقام‌ها</h2><p class="sub">اطلاعات پرداخت برای دسترسی سریع نگهداری می‌شود.</p></div><button class="btn btn-primary" onclick="openProxy()">＋ افزودن قائم‌مقام</button></div>${state.proxies.length?`<div class="table-wrap"><table class="table"><thead><tr><th>نام</th><th>اطلاعات پرداخت</th><th></th></tr></thead><tbody>${state.proxies.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.payment)||'<span class="sub">ثبت نشده</span>'}</td><td><button class="btn btn-soft" onclick="openProxy('${p.id}')">ویرایش</button> <button class="btn btn-danger" onclick="deleteProxy('${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>قائم‌مقامی ثبت نشده است</strong>در صورت نیاز، افراد جایگزین خود را اضافه کنید.</div>'}</div>`}
const reportScopes={financial:'all',work:'all'};
function setReportScope(type,scope){reportScopes[type]=scope;render(type)}
function reportFilters(type){const scope=reportScopes[type];return `<div class="segmented"><button class="${scope==='me'?'active':''}" onclick="setReportScope('${type}','me')">گزارش‌های من</button><button class="${scope==='proxy'?'active':''}" onclick="setReportScope('${type}','proxy')">گزارش قائم‌مقام‌ها</button><button class="${scope==='all'?'active':''}" onclick="setReportScope('${type}','all')">همه</button></div><div class="filters"><div class="field"><label>سال شمسی</label><select id="filter-year-${type}">${yearList().map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div><div class="field"><label>ماه شمسی</label><select id="filter-month-${type}"><option value="">همهٔ ماه‌ها</option>${persianMonths.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('')}</select></div><div class="field"><label>قائم‌مقام</label><select id="filter-person-${type}"><option value="all">همه</option>${state.proxies.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn btn-soft" onclick="applyReport('${type}')">اعمال فیلتر</button></div>`}
function filtered(type){const year=document.getElementById('filter-year-'+type)?.value||'',month=document.getElementById('filter-month-'+type)?.value||'',person=document.getElementById('filter-person-'+type)?.value||'all',scope=reportScopes[type];return state.shifts.filter(s=>s.date.startsWith(year+(month?'/'+month:''))&&(scope==='all'||(scope==='me'?s.worker==='me':s.worker==='proxy'))&&(person==='all'||s.proxyId===person))}
function applyReport(type){const list=filtered(type);const target=document.getElementById(type+'-results');target.innerHTML=type==='financial'?financialResult(list):workResult(list)}
function financialResult(list){const mine=list.filter(s=>s.worker==='me'),pr=list.filter(s=>s.worker==='proxy');return `<div class="metric-row"><div class="metric"><small>دستمزد من</small><b class="money">${toman(mine.reduce((a,s)=>a+total(s),0))}</b></div><div class="metric"><small>پرداخت قائم‌مقام‌ها</small><b class="money">${toman(pr.reduce((a,s)=>a+total(s),0))}</b></div><div class="metric"><small>مجموع دوره</small><b class="money">${toman(list.reduce((a,s)=>a+total(s),0))}</b></div></div><div style="margin-top:18px">${shiftRows(list)}</div>`}
function workResult(list){const hours=list.reduce((a,s)=>a+s.hours,0);const groups={};list.forEach(s=>{const key=pharmacy(s.pharmacyId)?.name||'حذف‌شده';groups[key]=(groups[key]||0)+s.hours});return `<div class="metric-row"><div class="metric"><small>ساعت کارکرد</small><b>${faNum(hours)} ساعت</b></div><div class="metric"><small>داروخانه‌های فعال</small><b>${faNum(Object.keys(groups).length)}</b></div><div class="metric"><small>مبلغ کارکرد</small><b class="money">${toman(list.reduce((a,s)=>a+total(s),0))}</b></div></div><div class="bar-list" style="margin-top:22px">${Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([name,h])=>`<div class="bar-line"><span class="bar-name">${esc(name)}</span><span class="bar-track"><span class="bar-fill" style="width:${hours?Math.max(4,h/hours*100):0}%"></span></span><span class="bar-val">${faNum(h)} ساعت</span></div>`).join('')||'<div class="empty">داده‌ای برای این بازه وجود ندارد.</div>'}</div><div style="margin-top:18px">${shiftRows(list)}</div>`}
function renderFinancial(){document.getElementById('view-financial').innerHTML=`<div class="card"><div class="card-head"><div><h2>گزارش مالی</h2><p class="sub">مبلغ دستمزد بر اساس نرخ ساعتی و مدت واقعی شیفت محاسبه شده است.</p></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-soft" onclick="exportReport('financial','csv')">Excel</button><button class="btn btn-soft" onclick="exportReport('financial','doc')">Word</button><button class="btn btn-soft" onclick="exportReport('financial','pdf')">PDF</button></div></div>${reportFilters('financial')}<div id="financial-results">${financialResult(state.shifts)}</div></div>`}
function renderWork(){document.getElementById('view-work').innerHTML=`<div class="card"><div class="card-head"><div><h2>گزارش کارکرد</h2><p class="sub">تفکیک بر اساس شخص و داروخانه در بازهٔ انتخابی.</p></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-soft" onclick="exportReport('work','csv')">Excel</button><button class="btn btn-soft" onclick="exportReport('work','doc')">Word</button><button class="btn btn-soft" onclick="exportReport('work','pdf')">PDF</button></div></div>${reportFilters('work')}<div id="work-results">${workResult(state.shifts)}</div></div>`}
async function cloudSave(){if(!cloudClient||!currentUser)return;const {error}=await cloudClient.from('user_data').upsert({user_id:currentUser.id,data:{pharmacies:state.pharmacies,proxies:state.proxies,shifts:state.shifts},updated_at:new Date().toISOString()});if(error)toast('ذخیرهٔ ابری انجام نشد')}
async function openAuth(){if(!cloudClient)return openModal(`<div class="modal-head"><h2>اتصال حساب</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">برای فعال شدن ورود ایمیلی، ابتدا URL و کلید عمومی Supabase را در تنظیمات فایل برنامه وارد کنید.</p><div class="notice">این دو مقدار محرمانه نیستند و از بخش Project Settings → API قابل دریافت‌اند.</div>`);openModal(`<div class="modal-head"><h2>ورود یا ثبت‌نام</h2><button class="close" onclick="closeModal()">×</button></div><form id="auth-form"><div class="field"><label>ایمیل</label><input name="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:12px"><label>رمز عبور</label><input name="password" type="password" minlength="6" required autocomplete="current-password"></div><div class="modal-actions"><button class="btn btn-primary" name="action" value="login">ورود</button><button class="btn btn-soft" name="action" value="signup">ثبت‌نام</button></div></form>`);document.getElementById('auth-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=f.get('email'),password=f.get('password'),action=e.submitter?.value;const result=action==='signup'?await cloudClient.auth.signUp({email,password}):await cloudClient.auth.signInWithPassword({email,password});if(result.error)return toast(result.error.message);if(action==='signup'&&!result.data.session)return toast('ایمیل تأیید برای شما ارسال شد');await finishLogin(result.data.user);closeModal()}}
async function finishLogin(user){currentUser=user;const {data}=await cloudClient.from('user_data').select('data').eq('user_id',user.id).maybeSingle();if(data?.data){state.pharmacies=data.data.pharmacies||[];state.proxies=data.data.proxies||[];state.shifts=data.data.shifts||[];localStorage.setItem(storeKey,JSON.stringify(state))}else await cloudSave();document.getElementById('auth-button').textContent=`خروج (${user.email})`;toast('حساب با موفقیت متصل شد');render('dashboard')}
async function logout(){if(cloudClient)await cloudClient.auth.signOut();currentUser=null;document.getElementById('auth-button').textContent='ورود / ثبت‌نام';toast('از حساب خارج شدید')}
async function initAuth(){if(!cloudClient)return;const {data}=await cloudClient.auth.getSession();if(data.session)await finishLogin(data.session.user)}
function toggleTheme(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('shiftyar-theme',dark?'dark':'light');document.getElementById('theme-toggle').textContent=dark?'☀ Light mode':'☾ Night mode'}
function backupData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,`shiftyar-backup-${dateNow().replaceAll('/','-')}.json`);toast('فایل پشتیبان آماده شد')}
function restoreData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.pharmacies)||!Array.isArray(data.proxies)||!Array.isArray(data.shifts))throw new Error();state.pharmacies=data.pharmacies;state.proxies=data.proxies;state.shifts=data.shifts;save();toast('اطلاعات بازیابی شد');nav('dashboard')}catch{toast('فایل پشتیبان معتبر نیست')}};reader.readAsText(file)};input.click()}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reportList(type){return filtered(type)}
function exportReport(type,format){const list=reportList(type),rows=[['تاریخ','داروخانه','شخص','شروع','پایان','ساعت','نرخ ساعتی','مبلغ']].concat(list.map(s=>[s.date,pharmacy(s.pharmacyId)?.name||'حذف‌شده',s.worker==='me'?'من':proxy(s.proxyId)?.name||'قائم‌مقام',s.start,s.end,s.hours,s.rate,total(s)]));const html=`<html lang="fa" dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma;padding:30px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #bbb;padding:8px;text-align:right}th{background:#dff5f0}</style><h1>گزارش ${type==='financial'?'مالی':'کارکرد'} شیفت‌یار</h1><table><tr>${rows[0].map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></html>`;if(format==='csv'){const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`shiftyar-${type}.csv`)}else if(format==='doc'){downloadBlob(new Blob([html],{type:'application/msword'}),`shiftyar-${type}.doc`)}else{const win=window.open('','_blank');if(!win)return toast('اجازهٔ باز شدن پنجره چاپ را فعال کنید');win.document.write(html);win.document.close();win.print()}}
function renderShifts(){document.getElementById('view-shifts').innerHTML=`<div class="card"><div class="card-head"><div><h2>همهٔ شیفت‌های ثبت‌شده</h2><p class="sub">از این صفحه می‌توانید هر شیفت را ویرایش یا حذف کنید.</p></div><button class="btn btn-primary" onclick="nav('shift')">＋ ثبت شیفت</button></div>${shiftRows(state.shifts,true)}</div>`}
function monthSelectors(prefix,selectedYear,selectedMonth){return `<div class="filters"><div class="field"><label>سال شمسی</label><select id="${prefix}-year" onchange="renderMonthlySelection()">${yearList().map(y=>`<option value="${y}" ${String(y)===String(selectedYear)?'selected':''}>${y}</option>`).join('')}</select></div><div class="field"><label>ماه شمسی</label><select id="${prefix}-month" onchange="renderMonthlySelection()">${persianMonths.map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===selectedMonth?'selected':''}>${m}</option>`}).join('')}</select></div></div>`}
function monthlyDays(month){return Number(month)<=6?31:Number(month)<=11?30:29}
function monthlyCalendar(list,year,month){const dayMap={};list.forEach(s=>{const d=s.date.split('/')[2];(dayMap[d] ||= []).push(s)});const headers=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];const cells=Array.from({length:monthlyDays(month)},(_,i)=>{const day=String(i+1).padStart(2,'0'),items=dayMap[day]||[];return `<div class="calendar-day"><div class="day-number">${faNum(i+1)}</div>${items.map(s=>`<div class="day-shift ${s.worker==='proxy'?'proxy-day':''}" title="${esc(pharmacy(s.pharmacyId)?.name||'')}">${esc(pharmacy(s.pharmacyId)?.name||'داروخانه')} · ${esc(s.start)}-${esc(s.end)}</div>`).join('')}${items.length?`<div class="calendar-summary">${items.map(s=>s.worker==='me'?'من':esc(proxy(s.proxyId)?.name||'قائم‌مقام')).join('، ')}</div>`:''}</div>`}).join('');return `<div class="calendar">${headers.map(h=>`<div class="calendar-head">${h}</div>`).join('')}${cells}</div>`}
function renderMonthly(){const [year,month]=dateNow().split('/');document.getElementById('view-monthly').innerHTML=`<div class="card"><div class="card-head"><div><h2>ماه‌نامهٔ تقویمی شیفت‌ها</h2><p class="sub">تمام روزهای ماه در یک قاب؛ هر روز خلاصهٔ شیفت‌های همان روز را نشان می‌دهد.</p></div><button class="btn btn-soft" onclick="printMonthly()">چاپ تقویم</button></div>${monthSelectors('monthly',year,month)}<div id="monthly-results">${monthlyResult(year,month)}</div></div>`}
function monthlyResult(year,month){const prefix=`${year}/${month}`;const list=state.shifts.filter(s=>s.date.startsWith(prefix));return `<div class="metric-row"><div class="metric"><small>ساعت کارکرد ماه</small><b>${faNum(list.reduce((a,s)=>a+s.hours,0))} ساعت</b></div><div class="metric"><small>مبلغ ماه</small><b class="money">${toman(list.reduce((a,s)=>a+total(s),0))}</b></div><div class="metric"><small>روزهای دارای ثبت</small><b>${faNum(new Set(list.map(s=>s.date)).size)} روز</b></div></div><div style="margin-top:18px">${monthlyCalendar(list,year,month)}</div>`}
function renderMonthlySelection(){const y=document.getElementById('monthly-year')?.value,m=document.getElementById('monthly-month')?.value;if(y&&m)document.getElementById('monthly-results').innerHTML=monthlyResult(y,m)}
function printMonthly(){const y=document.getElementById('monthly-year')?.value,m=document.getElementById('monthly-month')?.value;if(!y||!m)return;const win=window.open('','_blank');if(!win)return toast('اجازهٔ باز شدن پنجره چاپ را فعال کنید');win.document.write(`<html lang="fa" dir="rtl"><meta charset="utf-8"><title>ماه‌نامه شیفت‌ها</title><body style="font-family:Tahoma;padding:30px"><h1>ماه‌نامهٔ شیفت‌ها - ${esc(y)}/${esc(m)}</h1>${monthlyResult(y,m)}</body></html>`);win.document.close();win.print()}
function render(view){if(view==='dashboard')renderDashboard();if(view==='shift')renderShift();if(view==='pharmacies')renderPharmacies();if(view==='proxies')renderProxies();if(view==='financial')renderFinancial();if(view==='work')renderWork();if(view==='shifts')renderShifts();if(view==='monthly')renderMonthly()}
render('dashboard');
if(localStorage.getItem('shiftyar-theme')==='dark') document.body.classList.add('dark');
initAuth();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js');
</script></body></html>
